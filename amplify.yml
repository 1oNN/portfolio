version: 1

# AWS Amplify Hosting - Next.js App Router (SSR)
# Amplify auto-detects Next.js SSR; no standalone output needed.
#
# Required environment variables (set in Amplify Console):
#   ADMIN_PASSWORD, SESSION_SECRET,
#   APP_AWS_ACCESS_KEY_ID, APP_AWS_SECRET_ACCESS_KEY, APP_AWS_REGION,
#   SES_FROM_EMAIL, CONTACT_TO_EMAIL, DYNAMODB_BLOG_TABLE, DYNAMODB_CONTACTS_TABLE,
#   DYNAMODB_AGENT_TABLE, DYNAMODB_DOWNLOADS_TABLE, DYNAMODB_ANALYTICS_TABLE,
#   GROQ_API_KEY,
#   NEXT_PUBLIC_SITE_URL
#
# Amplify Console env vars exist at BUILD time only. The SSR Lambda that
# serves API routes does not inherit them, so the build must write the
# runtime-needed ones into .env.production (AWS-documented pattern).
# AWS_* names are deliberately excluded: Lambda reserves them for the
# compute role's temporary credentials.

frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        - node -v
        - npm -v
        - npm ci

    build:
      commands:
        - npm run type-check
        - export NODE_ENV=production
        - env | grep -E '^(GROQ_API_KEY|GROQ_MODEL|SESSION_SECRET|ADMIN_PASSWORD|SES_FROM_EMAIL|CONTACT_TO_EMAIL|APP_AWS_ACCESS_KEY_ID|APP_AWS_SECRET_ACCESS_KEY|APP_AWS_REGION|DYNAMODB_BLOG_TABLE|DYNAMODB_CONTACTS_TABLE|DYNAMODB_AGENT_TABLE|DYNAMODB_DOWNLOADS_TABLE|DYNAMODB_ANALYTICS_TABLE)=' >> .env.production || true
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - "**/*"

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
