version: 1

# AWS Amplify Hosting — Next.js 15 App Router (SSR)
# Amplify auto-detects Next.js SSR; no standalone output needed.
#
# Required environment variables (set in Amplify Console):
#   ADMIN_PASSWORD, SESSION_SECRET,
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION,
#   SES_FROM_EMAIL, DYNAMODB_BLOG_TABLE, DYNAMODB_CONTACTS_TABLE,
#   DYNAMODB_AGENT_TABLE, GROQ_API_KEY, NEXT_PUBLIC_SITE_URL

frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        - node -v
        - npm -v
        - npm ci

    build:
      commands:
        - npm run type-check
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - "**/*"

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
