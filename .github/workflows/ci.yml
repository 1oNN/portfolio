name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, type-check & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Gates on errors, not warnings. eslint-plugin-react-hooks v7 (new with
      # Next 16) reports ~90 pre-existing static-components and set-state-in-effect
      # findings as warnings; unused vars, the thing this step was added for,
      # is configured as an error in eslint.config.mjs.
      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          # Stub secrets so the build doesn't fail waiting on real values.
          # These are dummy values - no real credentials in CI.
          ADMIN_PASSWORD: ci-dummy-password
          SESSION_SECRET: ci-dummy-session-secret-32-chars-min
          NEXT_PUBLIC_SITE_URL: https://hammadahmad.co.uk
