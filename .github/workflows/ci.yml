name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          # Stub secrets so the build doesn't fail waiting on real values.
          # These are dummy values — no real credentials in CI.
          ADMIN_PASSWORD: ci-dummy-password
          SESSION_SECRET: ci-dummy-session-secret-32-chars-min
          NEXT_PUBLIC_SITE_URL: https://hammadahmad.co.uk
